[package]
name = "easy-env-app"
version = "0.1.2"
description = "easy-env Tauri desktop app"
authors = ["easy-env"]
edition = "2021"
rust-version = "1.77"

[lib]
# Required by Tauri v2 mobile build orchestration; harmless on desktop-only.
name = "easy_env_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
which = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Repairs the PATH env var for GUI launches on macOS/Linux (Finder/Dock
# spawn apps from launchd, which strips /usr/local/bin, /opt/homebrew/bin,
# nvm/volta paths — so `which docker` / `which node` come up empty unless
# we re-read the user's shell config). Tauri-recommended fix; tracked at
# https://github.com/tauri-apps/fix-path-env-rs.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[features]
# By default Tauri does not enable any features.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
